version: "3.8"

services:
  app:
    build:
      context: ./docker/php
    container_name: laravel_app
    volumes:
      - ./backend:/var/www
    working_dir: /var/www

  frontend:
    build:
      context: ./frontend
    container_name: react_app

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - frontend
# ─────────────────────────────────────────────────────────────────
#  LOCAL DEVELOPMENT
#  Usage: docker compose up -d
#  First time: bash scripts/local-setup.sh
# ─────────────────────────────────────────────────────────────────
name: astro-local

services:

  # ── MySQL ──────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: astro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${DB_DATABASE:-astrologer}
      MYSQL_USER:          ${DB_USERNAME:-astro_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: astro_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Laravel Backend (PHP-FPM) ──────────────────────────────────
  backend:
    build:
      context: ./backend            # build context = backend directory
      dockerfile: docker/php/Dockerfile  # relative to context (backend/)
      target: local
    container_name: astro_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql                # override to container name
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www          # live code — changes reflect instantly
      - backend_vendor:/var/www/vendor  # vendor persisted in named volume
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]   # validate php-fpm config
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React Frontend (Vite dev server) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/node/Dockerfile  # frontend/docker/node/Dockerfile
      target: dev
    container_name: astro_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # ── Nginx ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: astro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro   # Laravel public dir for PHP-FPM
    depends_on:
      - backend
      - frontend

  # ── Queue Worker ───────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: local
    container_name: astro_queue
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3 --max-jobs=1000
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:

version: "3.8"

services:
  backend:
    build: ./backend
    container_name: laravel_backend
    volumes:
      - ./backend:/var/www
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: react_frontend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
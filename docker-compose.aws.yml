# ─────────────────────────────────────────────────────────────────
#  AWS PRODUCTION
#  Usage: docker compose -f docker-compose.aws.yml up -d
#  First deploy: bash scripts/aws-deploy.sh
# ─────────────────────────────────────────────────────────────────
name: astro-aws

services:

  # ── Redis (on EC2; swap REDIS_HOST in .env.aws for ElastiCache) ─
  redis:
    image: redis:7-alpine
    container_name: astro_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Laravel Backend (PHP-FPM, production build) ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: astro_backend
    restart: always
    env_file: ./backend/.env.aws
    environment:
      # DB_HOST comes from .env.aws (RDS endpoint) — NOT overridden here
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx (serves SPA + reverse-proxies PHP-FPM) ──────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: astro_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/aws.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/public:ro         # Laravel public dir
      - ./frontend/dist:/usr/share/nginx/html:ro    # Built React SPA
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Queue Worker ───────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: astro_queue
    restart: always
    env_file: ./backend/.env.aws
    environment:
      REDIS_HOST: redis
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3 --max-jobs=1000
    depends_on:
      backend:
        condition: service_healthy

  # ── Laravel Scheduler ─────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: astro_scheduler
    restart: always
    env_file: ./backend/.env.aws
    environment:
      REDIS_HOST: redis
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
